<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="viewer.css">
  <script type="importmap">
    {"imports":{"three":"/vendor/build/three.module.js","three/addons/":"/vendor/examples/jsm/"}}
  </script>
  <script type="module" src="viewer.js"></script>
  <title>3D 모델 미리보기</title>
</head>
<body>
  <header aria-label="3D 모델 도구">
    <button id="fit" title="화면에 맞춤 (F)" aria-label="화면에 맞춤 (F)" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5M8 8l-5-5m13 5 5-5M8 16l-5 5m13-5 5 5"/></svg></button>
    <button id="wire" title="와이어프레임 (W)" aria-label="와이어프레임 (W)" aria-pressed="false" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 9 5v8l-9 5-9-5V8zM3 8l9 5 9-5m-9 5v8m0-8 5-10"/></svg></button>
    <button id="grid" title="바닥 격자 (G)" aria-label="바닥 격자 (G)" aria-pressed="true" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18M3 9h18M3 15h18M9 3v18m6-18v18"/></svg></button>
    <button id="rotate" title="자동 회전 (R)" aria-label="자동 회전 (R)" aria-pressed="false" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M5.5 9A7 7 0 0 1 18 6l2 2M4 16l2 2a7 7 0 0 0 12.5-3"/></svg></button>
    <label id="animation-label" title="애니메이션 선택" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h7"/><circle cx="18" cy="15" r="3"/></svg><select id="animation" aria-label="애니메이션 선택" disabled></select></label>
    <button id="play" title="애니메이션 재생" aria-label="애니메이션 재생" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7z"/></svg></button>
    <button id="stop" title="애니메이션 정지" aria-label="애니메이션 정지" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v10H7z"/></svg></button>
    <span id="stats" role="status" aria-live="polite"></span>
  </header>
  <main><div id="canvas-wrap" aria-label="3D 모델 보기 영역"><canvas id="canvas" aria-label="3D 모델. 왼쪽 끌기: 회전, 오른쪽 끌기: 이동, 휠: 확대·축소"></canvas></div></main>
  <footer id="status" role="status">3D 모델을 준비하고 있습니다.</footer>
</body>
</html>
